name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Give git a committer identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: pip install pytest
      - run: python -m pytest -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: worker
        run: npm ci
      - name: Secrets for the local runtime
        # Not a secret. wrangler types and miniflare read .dev.vars, which is
        # gitignored, so CI has to recreate it or the suite cannot type-check.
        # It must match the value the tests send.
        working-directory: worker
        run: |
          echo "BOARD_TOKEN=local-dev-token-not-a-real-secret" > .dev.vars
          echo "VIEW_TOKEN=view-token-for-tests" >> .dev.vars
      - name: Generate binding types
        # worker-configuration.d.ts is generated, so it is gitignored and a
        # fresh clone has no Env, Request or crypto types at all. Without this
        # step tsc fails on every line of the Worker.
        working-directory: worker
        run: npx wrangler types

      - name: Test
        working-directory: worker
        run: npm test   # tsc --noEmit && vitest run
